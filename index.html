<style>
/*
VOICE: 아이들이 신나게 노는 만화책 같은 퀴즈 게임
IDEA: 만화 스티커 — 굵은 잉크 선, 딱 떨어지는 그림자, 표정 있는 캐릭터 카드

:root{color-scheme:light;--ink:#2d2346;--sky1:#7fd4ff;--sky2:#d2f2ff;--sun:#ffd23f;--coral:#ff6b6b;--mint:#7ee0bd;--grape:#8b6cff;--muted:#5d5480;--bw:3px;--sh:0 4px 0 var(--ink);
--ol:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),-2px -2px var(--ink);
--ol2:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),1.5px 1.5px var(--ink),-1.5px 1.5px var(--ink),1.5px -1.5px var(--ink),-1.5px -1.5px var(--ink)}
*{box-sizing:border-box;min-width:0}
html{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;height:100%;overflow:hidden}
body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;margin:0;color:var(--ink);font:16px/1.5 "Gowun Dodum",system-ui,sans-serif;min-height:100vh;overflow-x:clip;
  background:radial-gradient(circle,rgba(255,255,255,.55) 1.6px,transparent 2.2px) 0 0/22px 22px fixed,linear-gradient(180deg,var(--sky1),var(--sky2) 75%) fixed}
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}

.clouds .c1{width:150px;top:12px;right:6%;animation:drift 18s ease-in-out infinite alternate}
.clouds .c2{width:96px;top:58%;left:-20px;animation:drift 24s ease-in-out infinite alternate-reverse}
.clouds .c3{width:120px;bottom:8%;right:-24px;animation:drift 20s ease-in-out infinite alternate}

@media(min-width:821px){.clouds .c1{right:auto;left:42%;top:26px}}
.start{position:fixed;inset:0;z-index:20;display:flex;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
  background:radial-gradient(circle,rgba(255,255,255,.55) 1.6px,transparent 2.2px) 0 0/22px 22px,linear-gradient(180deg,var(--sky1),var(--sky2) 80%)}

.start-in{margin:auto;width:min(620px,100%);padding:24px 18px 32px;display:flex;flex-direction:column;align-items:center;text-align:center}
.hero{width:min(300px,62vw,34vh);margin-bottom:4px}
.hero svg{display:block;width:100%;height:auto;overflow:visible}
.hero .hg{animation:bob 2.4s ease-in-out infinite;transform-origin:256px 400px}
.hero .hl{animation:wigL 3s ease-in-out infinite;transform-origin:178px 320px}

@keyframes bob{50%{transform:translateY(-14px) rotate(-3deg)}}
@keyframes wigL{50%{transform:rotate(-5deg)}}
@keyframes wigR{50%{transform:rotate(5deg)}}
@keyframes twinkle{50%{opacity:.35}}
.st-title{font:400 clamp(32px,min(10vw,7vh),64px)/1.1 "Jua",sans-serif;margin:0;color:#fff;text-shadow:var(--ol),0 6px 0 var(--ink),3px 6px 0 var(--ink),-3px 6px 0 var(--ink)}
.st-title span{display:inline-block;color:var(--sun);transform:rotate(-3deg)}
.st-sub{margin:14px 0 18px;font:400 18px "Jua",sans-serif;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:4px 14px;box-shadow:0 3px 0 var(--ink)}
.st-levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%}
.st-levels button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 4px 9px;border:var(--bw) solid var(--ink);border-radius:20px;background:#fff;color:var(--ink);box-shadow:var(--sh);cursor:pointer;font-family:"Jua",sans-serif;transition:transform .15s}
.st-levels i{font-style:normal;font-size:30px;line-height:1.15}

  .hero{grid-area:hero;width:min(260px,40vw,60vh)}.st-title{grid-area:title;font-size:clamp(28px,9vh,44px)}.st-sub{grid-area:sub;margin:8px 0}.st-levels{grid-area:levels;grid-template-columns:repeat(4,minmax(0,1fr))}.st-mode{grid-area:mode;margin-top:10px}.st-go{grid-area:go;margin-top:12px}
  .st-levels em{display:none}}

@media(prefers-reduced-motion:reduce){.hero .hg,.hero .hl,.hero .hr,.hero .hs,.st-go{animation:none}}

.rank-head{position:relative}
.rclose{border:var(--bw) solid var(--ink);background:#fff;color:var(--ink);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 3px 0 var(--ink);margin-left:auto;order:3}
.rclose svg{width:20px;height:20px}
.rank .rlv{display:inline-flex;margin:4px 0 8px}
#rankLevels button[aria-pressed=true]{background:var(--sun)}
.menubtn{grid-area:menu;width:58px;height:58px;border-radius:18px;border:var(--bw) solid var(--ink);background:#fff;color:var(--ink);box-shadow:var(--sh);display:grid;place-items:center;cursor:pointer;padding:0}

.menu{overflow:auto;overscroll-behavior:contain}

.themes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.themes button{border:0;background:none;padding:4px 2px 2px;border-radius:14px;cursor:pointer;color:var(--ink);font:400 13px "Jua",sans-serif;display:flex;flex-direction:column;align-items:center;gap:6px}

.switch{position:relative;flex:none;width:78px;height:40px;border-radius:999px;border:var(--bw) solid var(--ink);background:#e9e5f5;box-shadow:0 3px 0 var(--ink);cursor:pointer;padding:0}

.peek[hidden]{display:none}
.peeknum{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;text-align:center;white-space:nowrap;font:400 clamp(120px,36vmin,320px)/1 "Jua",sans-serif;color:rgba(255,255,255,.3);-webkit-text-stroke:max(3px,.022em) rgba(45,35,70,.5);text-shadow:0 .04em 0 rgba(45,35,70,.15)}

function ctx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(ac.state==="suspended")ac.resume().catch(()=>{});return ac}
function tone(f,d,{type="sine",vol=.18,at=0,to=null,attack=.008}={}){
  if(!soundOn)return;const a=ctx();if(!a)return;
  const t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);
}
function noise(d,vol=.12,at=0,hp=2000){
  if(!soundOn)return;const a=ctx();if(!a)return;
  const t=a.currentTime+at,len=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=buf;f.type="highpass";f.frequency.value=hp;g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start(t);
}

    p.style.cssText=`left:${cx}px;top:${cy}px;width:${s}px;height:${s*(.5+Math.random())}px;background:${cols[i%cols.length]};${Math.random()<.4?"border-radius:50%;":""}`;
    fx.appendChild(p);

    p.animate([{transform:"translate(-50%,-50%) rotate(0)",opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy+90}px)) rotate(${Math.random()*720-360}deg)`,opacity:0}],{duration:700+Math.random()*500,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish=()=>p.remove();

function setSeg(id,val){for(const b of $(id).querySelectorAll("button"))b.setAttribute("aria-pressed",String(b.dataset.v===String(val)))}
function layout(){
  const b=$("board"),n=cards.length;if(!n)return;
  const W=b.parentElement.clientWidth,gap=parseFloat(getComputedStyle(b).columnGap)||8;
  // 제목·점수판을 뺀 남은 화면 전체를 카드판으로 씀. 카드 모양(가로:세로)은 2:3~4:4.7 사이에서 남는 칸에 맞게 늘려 빈 공간을 줄임
  const top=b.getBoundingClientRect().top,Hh=Math.max(innerHeight-top-12,200),AR_MIN=.66,AR_MAX=.85;
  let best=null;
  for(let c=2;c<=14;c++){const rows=Math.ceil(n/c),waste=rows*c-n;if(waste>Math.floor(c/3))continue;
    const cw=(W-gap*(c-1))/c,ch=(Hh-gap*(rows-1))/rows;
    let w=Math.min(cw,ch*AR_MAX,240),h=Math.min(ch,w/AR_MIN);
    const fill=((w*c+gap*(c-1))*(h*rows+gap*(rows-1)))/(W*Hh),score=w*h*(.85+.15*fill);
    if(!best||score>best.score*1.01)best={c,w,h,score}}
  b.style.setProperty("--cols",best.c);b.style.setProperty("--ar",(best.w/best.h).toFixed(4));
  b.style.maxWidth=Math.floor(best.w*best.c+gap*(best.c-1))+"px";
  b.style.fontSize=Math.max(.62,Math.min(1.3,best.w/110))+"em";
}

}

function endMiss(){missT.forEach(clearTimeout);missT=[];if(missPair)for(const x of missPair){x.classList.remove("up","shake");x.setAttribute("aria-label","뒤집힌 카드 "+(+x.dataset.i+1))}missPair=null;open=[];lock=false}

// 미리 보기: 시작할 때 모든 카드를 5초 동안 보여준 뒤 덮음(시간은 첫 카드를 뒤집을 때부터)
function startPeek(){
  const cs=[...$("board").children];if(!cs.length)return;
  peeking=true;lock=true;document.body.classList.add("peeking");
  cs.forEach(c=>c.classList.add("up"));sfx.flip();

  const pn=$("peekNum");pn.hidden=false;pn.innerHTML='<span class="n"></span>';const pnn=pn.firstChild;

  clearInterval(peekT);peekT=null;$("peekBadge").hidden=true;$("peekNum").hidden=true;
  if(!peeking)return;

function flip(el){
  const i=+el.dataset.i,k=cards[i];

  if(lock){
    // 틀린 두 장을 보여주는 중에 다른 카드를 누르면: 기다리지 않고 바로 덮고 새 카드를 뒤집음
    if(missPair)endMiss();

  }
  if(!started){started=true;timer=setInterval(()=>{secs++;update()},1000)}
 sfx.flip();
  el.classList.add("up");el.setAttribute("aria-label",k.c[1]+(k.kind==="flag"?" 국기":" 이름"));

  if(ka.c[0]===kb.c[0]){
    combo++;bestCombo=Math.max(bestCombo,combo);const c=combo,g=gameId;
    // 짝 판정은 바로 끝내서 다음 카드를 곧장 누를 수 있게 하고, 효과만 뒤집힘이 끝난 뒤(0.35초) 보여줌

      const n=Math.min(c>=2?10+c*4:8,22);burst(a,n,cols);burst(b,n,cols);

           setTimeout(()=>{endMiss();runQueued()},1000)];

// 터치: 손가락이 조금 미끄러져도 같은 카드 위에서 떼면 뒤집기. 터치 뒤 따라오는 click은 무시

let tUsed=0;

  const c=e.target.closest&&e.target.closest(".card");if(c)return c;
  let best=null,bd=18;

  return best;
}
$("board").parentElement.addEventListener("pointerdown",e=>{

  if(e.width>=70&&e.height>=70)return; // 손바닥처럼 넓게 닿은 건 무시
  const c=cardAt(e);if(!c)return;
  tUsed=Date.now();flip(c);

$("board").addEventListener("click",e=>{if(Date.now()-tUsed<800)return;const c=e.target.closest(".card");if(c)flip(c)});
$("board").addEventListener("contextmenu",e=>e.preventDefault());
// 게임에 영향을 주는 설정: 판이 진행 중이면(카드를 안 뒤집었어도) 지금 새 게임/다음 판부터 중 고르게 함
function syncMenuSegs(){setSeg("modeSeg",next.mode);setSeg("sizeSeg",String(next.size));$("region").value=next.region;setPeekUI()}
function inProgress(){return cards.length&&matched<cards.length/2}
function changeSetting(k,v){
  next[k]=v;syncMenuSegs();saveSettings();
  if(!inProgress()){newGame();return}
  const diff=next.mode!==mode||next.size!==size||next.region!==region||next.peek!==peek,pb=$("pendBar");
  pb.hidden=!diff;pb.dataset.state="ask";
}
$("modeSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(b)changeSetting("mode",b.dataset.v)});
$("sizeSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(b)changeSetting("size",+b.dataset.v)});
$("region").addEventListener("change",e=>changeSetting("region",e.target.value));
$("pendNow").addEventListener("click",()=>{setMenu(false);newGame()});
$("pendLater").addEventListener("click",()=>{$("pendBar").dataset.state="later"});
const themeNames={globe:"지구",web:"거미",ocean:"물고기",star:"별",bamboo:"판다",cat:"고양이"};
$("themeSeg").innerHTML=Object.keys(themeNames).map(t=>`<button data-v="${t}" aria-pressed="false" aria-label="${themeNames[t]} 친구"><span class="mini" data-cardtheme="${t}"><span class="face back">${cardBacks[t]}</span></span><span class="tn">${themeNames[t]}</span></button>`).join("");
$("themeSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cardTheme=b.dataset.v;setSeg("themeSeg",cardTheme);document.documentElement.dataset.cardtheme=cardTheme;
  // 그림만 바꾸고 하던 게임은 그대로 유지
  const svg=getBack();document.querySelectorAll("#board .back").forEach(x=>x.innerHTML=svg);
  saveSettings()});
const menu=$("menu"),mb=$("menuBtn");
function setMenu(o){menu.hidden=!o;if(o){menu.style.maxHeight="";const t=menu.getBoundingClientRect().top;menu.style.maxHeight=Math.max(200,innerHeight-t-10)+"px"}mb.setAttribute("aria-expanded",String(o));mb.setAttribute("aria-label",o?"설정 닫기":"설정 열기")}
mb.addEventListener("click",()=>setMenu(menu.hidden));
document.addEventListener("click",e=>{if(!menu.hidden&&!menu.contains(e.target)&&!mb.contains(e.target)){setMenu(false);e.stopPropagation();e.preventDefault()}},true);
addEventListener("keydown",e=>{if(e.key==="Escape"&&!menu.hidden){setMenu(false);mb.focus()}});
// 랭킹 창
const rp=$("rankPop");
function setRank(o){rp.hidden=!o;if(o){setMenu(false);rankSize=null;renderRank();$("rankClose").focus({preventScroll:true})}else $("rankBtn").focus({preventScroll:true})}
$("rankBtn").addEventListener("click",()=>setRank(true));
$("rankClose").addEventListener("click",()=>setRank(false));
rp.addEventListener("click",e=>{if(e.target===rp)setRank(false)});
addEventListener("keydown",e=>{if(e.key==="Escape"&&!rp.hidden)setRank(false)});
$("rankLevels").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;rankSize=+b.dataset.v;renderRank()});
$("newGame").addEventListener("click",()=>{setMenu(false);newGame()});
function setPeekUI(){$("peekBtn").setAttribute("aria-checked",String(next.peek))}
$("peekBtn").addEventListener("click",()=>changeSetting("peek",!next.peek));
$("rankSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;rankView=b.dataset.v;store.set("flagmem-rankview",rankView);renderRank()});
$("regForm").addEventListener("submit",async e=>{
  e.preventDefault();if(!lastRec||!shared.db)return;
  const nick=$("nick").value.trim().slice(0,16);if(!nick){$("regMsg").textContent="이름을 적어 주세요.";$("nick").focus();return}
  if(shared.ok==="read"){$("regMsg").textContent="이 페이지에서는 보기만 할 수 있어 등록할 수 없어요.";return}
  store.set("flagmem-nick",nick);$("regBtn").disabled=true;$("regMsg").textContent="등록 중…";
  try{const imp=await submitShared(nick);
    const pos=sharedTop(lastRec.k).findIndex(r=>r.id===shared.uid)+1;
    $("regMsg").textContent=imp?(pos?`등록했어요! 모두의 랭킹 ${pos}위예요.`:"등록했어요!"):"이미 이보다 좋은 기록이 올라가 있어요.";
    rankView="all";renderRank();
  }catch(err){$("regBtn").disabled=false;$("regMsg").textContent=err&&err.code==="invalid_argument"?"이 페이지에서는 기록을 올릴 권한이 없어요.":"등록하지 못했어요. 잠시 후 다시 시도해 주세요."}
});
const sb=$("snd");sb.setAttribute("aria-pressed",String(soundOn));
sb.addEventListener("click",()=>{soundOn=!soundOn;sb.setAttribute("aria-pressed",String(soundOn));store.set("flagmem-sound",soundOn);if(soundOn)sfx.flip()});
$("again").addEventListener("click",newGame);
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(layout,150)});

syncMenuSegs();
document.documentElement.dataset.cardtheme=cardTheme;setSeg("themeSeg",cardTheme);setPeekUI();
// 첫 화면: 난이도·놀이 방법을 고르고 "시작하기"로 게임 시작
function renderStart(){
  setSeg("startLevels",String(next.size));setSeg("startMode",next.mode);
  for(const b of $("startLevels").children){const k=next.mode+"-"+b.dataset.v+"-"+next.region,top=localTop(k)[0];
    b.querySelector("em").textContent=top?`최고 ${top.m}번 · ${fmt(top.s)}`:"";}
}
function showStart(){
  $("pendBar").hidden=true;clearInterval(timer);timer=null;resetPending();stopPeek(false);setMenu(false);$("overlay").classList.remove("show");
  renderStart();$("start").hidden=false;document.body.classList.add("onstart");
}
$("startLevels").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;next.size=+b.dataset.v;syncMenuSegs();saveSettings();renderStart();sfx.flip()});
$("startMode").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;next.mode=b.dataset.v;syncMenuSegs();saveSettings();renderStart();sfx.flip()});
$("startBtn").addEventListener("click",()=>{$("start").hidden=true;document.body.classList.remove("onstart");sfx.match(1);newGame()});
$("menuHome").addEventListener("click",showStart);
$("toHome").addEventListener("click",showStart);
// 설치한 앱(GitHub 주소)에서만: 메뉴의 "업데이트 확인"으로 최신 버전을 확인하고 바로 받기
if(document.querySelector('link[rel="manifest"]')){
  const ub=$("updBtn"),um=$("updMsg"),cur=parseInt($("buildInfo").textContent)||0;ub.hidden=false;
  ub.addEventListener("click",async()=>{
    if(ub.dataset.ready){um.textContent="새 버전으로 바꾸는 중…";ub.disabled=true;
      try{const r=await navigator.serviceWorker?.getRegistration();await r?.update()}catch(e){}
      location.reload();return}
    ub.disabled=true;um.textContent="확인 중…";
    try{
      const r=await fetch("version.json",{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();
      if(j.version>cur){um.textContent=`새 버전 ${j.version}이 있어요! (${j.build}) 지금 하던 게임은 처음부터 다시 시작돼요.`;ub.textContent="지금 업데이트";ub.dataset.ready="1"}
      else um.textContent="✓ 지금 최신 버전이에요.";
    }catch(e){um.textContent="확인하지 못했어요. 인터넷 연결을 확인해 주세요."}
    ub.disabled=false;
  });
}
showStart();
if(document.fonts)document.fonts.ready.then(layout);
initShared();
if("serviceWorker" in navigator){
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
}
}
</script>
</body>
</html>
